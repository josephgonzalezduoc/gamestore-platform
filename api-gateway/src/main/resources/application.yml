server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:

            # COMPRADOR-SERVICE
            - id: comprador-service
              uri: lb://COMPRADOR-SERVICE
              predicates:
                - Path=/api/compradores/**

            # JUEGO-SERVICE
            - id: juego-service
              uri: lb://JUEGO-SERVICE
              predicates:
                - Path=/api/juegos/**

            # STOCK-SERVICE
            - id: stock-service
              uri: lb://STOCK-SERVICE
              predicates:
                - Path=/api/stock/**

            # COMPRA-SERVICE
            - id: compra-service
              uri: lb://COMPRA-SERVICE
              predicates:
                - Path=/api/compras/**

            # BIBLIOTECA-SERVICE
            - id: biblioteca-service
              uri: lb://BIBLIOTECA-SERVICE
              predicates:
                - Path=/api/biblioteca/**

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true
