server:
  port: 8082

spring:
  application:
    name: juego-service

  datasource:
    # En ejecucion nativa usa localhost (XAMPP/MySQL). En Docker se sobreescribe con DB_HOST=mysql
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/juego_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      # En ejecucion nativa usa localhost. En Docker se sobreescribe con EUREKA_HOST=eureka-server
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true
